name: install.sh

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: Fake Termux harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run install.sh in CI harness
        run: bash tests/ci/run.sh
